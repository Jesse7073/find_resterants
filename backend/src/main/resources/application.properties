spring.application.name=backend

# 資料庫連線（機敏資訊透過環境變數帶入，不寫死在檔案中，不得提交實際帳密進版控，見 docs/phase3-design.md）
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/find_restaurants}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema 一律由 Flyway migration 管理，JPA 不自動建表/改表
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT 簽章密鑰透過環境變數帶入，本機開發預設值僅供本機測試使用，正式環境必須覆蓋
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
